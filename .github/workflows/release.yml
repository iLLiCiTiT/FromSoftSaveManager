name: Release

# Pushing a version tag creates a draft release with both zip files.
# Starting the workflow manually with a version sets that version in CMakeLists.txt, commits
#   it to the selected branch, tags the commit and creates the draft release from it.
# Starting the workflow manually without a version only builds the zip files and keeps them
#   as artifacts of the run.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.7.0. Leave empty to only build the zip files.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Start the release from a branch, not from '${{ github.ref }}'."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not in format X.Y.Z."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::Version '$VERSION' is not higher than the latest release '$latest'."
            exit 1
          fi
          echo "Releasing $VERSION (latest release: ${latest:-none})"

      - name: Set version
        run: |
          sed -i -E "s/^(project\(FromSoftSaveManager VERSION )[0-9.]+\)/\1$VERSION)/" CMakeLists.txt
          pwsh ./scripts/check_release_version.ps1 -Tag "$VERSION"

      - name: Commit and tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- CMakeLists.txt; then
            echo "CMakeLists.txt already has version $VERSION"
          else
            git commit -m "Bump version to $VERSION" -- CMakeLists.txt
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Runs also when 'prepare' is skipped (tag push or build without version)
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    strategy:
      matrix:
        include:
          - name: FromSoftSaveManager
            inv_images: 'ON'
          - name: FromSoftSaveManager-minified
            inv_images: 'OFF'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.ref }}
          submodules: recursive

      - name: Check version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: ./scripts/check_release_version.ps1 -Tag $env:RELEASE_TAG

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310 tools_ninja,qt.tools.ninja
          cache: true

      - name: Use Qt tools
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:IQTA_TOOLS\Ninja" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          -DFSSM_USE_INV_IMAGES=${{ matrix.inv_images }}

      - name: Build
        shell: pwsh
        run: cmake --build build --target FromSoftSaveManager

      - name: Package
        shell: pwsh
        run: ./scripts/package_release.ps1 -BuildDir build -Name '${{ matrix.name }}' -OutDir dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:RELEASE_TAG
          dist/FromSoftSaveManager.zip
          dist/FromSoftSaveManager-minified.zip
          --repo '${{ github.repository }}'
          --verify-tag
          --draft
          --generate-notes
